<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTC Ingame Dispatcher</title><link rel="stylesheet" href="/style.css"><style>
body{background:#000a}.overlay{width:940px;max-width:96%;margin:3vh auto;background:#111d22;border:1px solid #64747b}.overlay header{height:52px;padding:0 18px}.state{padding:12px;background:#07141d;border-radius:6px;margin:10px 0}.ok{color:#56d66b}.hidden{display:none}.dispatch-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}select{width:100%}label{display:block;color:#9fb2bc}button{margin-top:10px}
</style></head><body><div class="panel overlay"><header><b>VTC TRUCK HUB · INGAME-DISPATCHER</b><span style="margin-left:auto">TAB zum Schließen</span></header>
<div id="game-state" class="state">Spielstatus wird geprüft …</div><div id="loading" class="state">Dispatcher-Daten werden geladen …</div>
<div id="real" class="hidden"><div class="dispatch-grid"><label>Abholfirma<select id="source"></select></label><label>Zielfirma<select id="destination"></select></label><label>Für diese Abholfirma gültige Fracht mit Trailer<select id="template"></select></label><label>Dringlichkeit<select id="urgency"><option value="0">Normal</option><option value="1">Dringend</option><option value="2">Sehr dringend</option></select></label></div><div id="selection" class="state"></div><button id="create" class="primary">AUFTRAG IN ETS2 ERZEUGEN UND LADEN</button><div id="result" class="state hidden"></div></div>
</div><script>
function $(s){return document.querySelector(s)}var catalog=null;
function api(url,method,data,done){var x=new XMLHttpRequest();x.open(method||'GET',url,true);x.setRequestHeader('content-type','application/json');x.onreadystatechange=function(){if(x.readyState===4){var d={};try{d=JSON.parse(x.responseText||'{}')}catch(e){d={error:e.message}}done(d,x.status)}};x.send(data?JSON.stringify(data):null)}
function labelCompany(c){return c.city+' · '+c.company}function option(value,text){var o=document.createElement('option');o.value=value;o.textContent=text;return o}
function sourceTemplates(){var s=catalog&&catalog.companies.filter(function(c){return c.unit===$('#source').value})[0],ids=s?s.offerIds:[];return catalog?catalog.templates.filter(function(t){return ids.indexOf(t.id)>=0}):[]}
function fillSourceTemplates(){var list=sourceTemplates();$('#template').innerHTML='';for(var i=0;i<list.length;i++)$('#template').appendChild(option(list[i].id,list[i].cargo.replace('cargo.','')+' · '+list[i].trailerDefinition.replace('trailer_def.','')));syncDestination()}
function syncDestination(){var t=catalog&&catalog.templates.filter(function(x){return x.id===$('#template').value})[0];if(t&&t.destinationUnit)$('#destination').value=t.destinationUnit;$('#destination').disabled=true}
function update(){if(!catalog)return;var s=catalog.companies.filter(function(c){return c.unit===$('#source').value})[0],d=catalog.companies.filter(function(c){return c.unit===$('#destination').value})[0],t=catalog.templates.filter(function(x){return x.id===$('#template').value})[0];$('#selection').textContent=s&&d&&t?labelCompany(s)+' → '+labelCompany(d)+' · '+t.cargo.replace('cargo.','')+' · '+t.trailerDefinition.replace('trailer_def.',''):'Auswahl unvollständig'}
function load(){api('/api/real-dispatch/catalog','GET',null,function(d,status){if(status!==200){$('#loading').textContent=(d.error||'Dispatcher noch nicht eingerichtet')+'. ETS2 vollständig schließen und im Launcher erneut auf SPIELEN drücken; die Einrichtung wird dort automatisch angeboten.';return}catalog=d;var sources=d.companies.filter(function(c){return c.offerIds&&c.offerIds.length}),dest=d.companies;for(var i=0;i<sources.length;i++)$('#source').appendChild(option(sources[i].unit,labelCompany(sources[i])));for(var j=0;j<dest.length;j++)$('#destination').appendChild(option(dest[j].unit,labelCompany(dest[j])));if(dest.length>1)$('#destination').selectedIndex=1;fillSourceTemplates();$('#loading').className='hidden';$('#real').className='';update()})}
function gameStatus(){api('/api/test-save/status','GET',null,function(d){if(!d.testSave){$('#game-state').className='state';$('#game-state').textContent='Einmalige Einrichtung fehlt: ETS2 schließen und im Launcher auf SPIELEN drücken. Der Launcher legt nach deiner Bestätigung eine sichere Kopie deines neuesten Autosaves an.';return}var g=d.ingame||{},l=g.loaded,s=l?l.folder:'anderer Spielstand';$('#game-state').className='state '+(g.expectedLoaded?'ok':'');$('#game-state').textContent=g.expectedLoaded?'VTC-Dispatcher-Spielstand ist geladen. Dispatcher bereit.':'Dispatcher ist eingerichtet. Nach dem Erzeugen eines Auftrags wird der richtige VTC-Spielstand automatisch geladen (aktuell: '+s+').'})}
$('#source').onchange=function(){fillSourceTemplates();update()};$('#template').onchange=function(){syncDestination();update()};
$('#create').onclick=function(){var data={sourceUnit:$('#source').value,destinationUnit:$('#destination').value,templateOfferId:$('#template').value,urgency:Number($('#urgency').value)};$('#create').disabled=true;api('/api/real-dispatch/apply','POST',data,function(d,status){if(status!==200){$('#create').disabled=false;$('#result').className='state';$('#result').textContent=d.error||'Fehler';return}$('#result').className='state ok';$('#result').textContent='Auftrag validiert. VTC-Testslot wird automatisch geladen …';api('/api/real-dispatch/load-test-slot','POST',{},function(l,ls){if(ls!==202){$('#create').disabled=false;$('#result').className='state';$('#result').textContent=l.error||'Automatisches Laden fehlgeschlagen'}})})};load();gameStatus();setInterval(gameStatus,2000);
</script></body></html>
