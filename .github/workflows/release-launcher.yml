name: Build and release launcher
on:
  workflow_dispatch:
  push:
    tags: ['launcher-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - name: Test TypeScript dispatcher core
        shell: pwsh
        run: |
          pnpm --dir dispatcher-core install --frozen-lockfile
          pnpm --dir dispatcher-core run typecheck
          pnpm --dir dispatcher-core test
          pnpm --dir dispatcher-core run build
      - name: Test server and local API
        shell: pwsh
        run: |
          node --test tests/database.test.mjs tests/server.test.mjs tests/multiplayer-hub.test.mjs vtc-client/tests/*.test.mjs
          dotnet test launcher-src/VtcTruckHub.Launcher.Tests/VtcTruckHub.Launcher.Tests.csproj -c Release
      - name: Verify launcher versions stay synchronized
        shell: pwsh
        run: |
          $runtime = Select-String vtc-client/launcher.mjs -Pattern "RUNTIME_VERSION='([^']+)'"
          $service = Select-String launcher-src/VtcTruckHub.Launcher/RuntimeService.cs -Pattern 'ExpectedRuntimeVersion = "([^"]+)"'
          if ($runtime.Matches[0].Groups[1].Value -ne $service.Matches[0].Groups[1].Value) { throw 'Launcher runtime versions are not synchronized' }
      - name: Publish native launcher
        shell: pwsh
        run: dotnet publish launcher-src/VtcTruckHub.Launcher/VtcTruckHub.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o launcher-src/publish
      - name: Build official SCS telemetry bridge
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://download.eurotrucksimulator2.com/scs_sdk_1_14.zip' -OutFile scs_sdk.zip
          Expand-Archive scs_sdk.zip -DestinationPath scs_sdk
          cmake -S vtc-client/native-plugin -B vtc-client/native-plugin/build -A x64 "-DSCS_SDK_INCLUDE=$pwd/scs_sdk/include"
          cmake --build vtc-client/native-plugin/build --config Release
          New-Item -ItemType Directory -Force launcher-src/publish/native-plugin,launcher-src/publish/native-plugin/overlay-host | Out-Null
          Copy-Item vtc-client/native-plugin/build/Release/vtc_truck_hub.dll launcher-src/publish/native-plugin/
          Copy-Item vtc-client/native-plugin/overlay-host/* launcher-src/publish/native-plugin/overlay-host/
      - name: Bundle local service without a visible console
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launcher-src/publish/runtime-node,launcher-src/publish/lib,launcher-src/publish/ui,launcher-src/publish/catalog | Out-Null
          Copy-Item (Get-Command node.exe).Source launcher-src/publish/runtime-node/node.exe
          Copy-Item vtc-client/launcher.mjs,vtc-client/config.example.json,vtc-client/package.json launcher-src/publish/
          Copy-Item vtc-client/lib/*.mjs launcher-src/publish/lib/
          Copy-Item vtc-client/lib/dispatcher-core launcher-src/publish/lib/dispatcher-core -Recurse
          Copy-Item vtc-client/ui/* launcher-src/publish/ui/
          Copy-Item vtc-client/catalog/*.json launcher-src/publish/catalog/
          node -e "import('./launcher-src/publish/lib/dispatcher-core/index.js').then(m => { if (!m.JobInjector || !m.SiiParser) process.exit(2) })"
      - name: Bundle licensed save decryptor for the dispatcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launcher-src/publish/tools,launcher-src/publish/licenses/SII-Decrypt | Out-Null
          $source = 'https://raw.githubusercontent.com/TheLazyTomcat/SII_Decrypt/683e1d8addc96947967148a29a07e0859736a926'
          Invoke-WebRequest "$source/Program_Console/Lazarus/Release/win_x64/SII_Decrypt.exe" -OutFile launcher-src/publish/tools/SII_Decrypt.exe
          Invoke-WebRequest "$source/license.txt" -OutFile launcher-src/publish/licenses/SII-Decrypt/LICENSE.txt
          $actual = (Get-FileHash launcher-src/publish/tools/SII_Decrypt.exe -Algorithm SHA256).Hash
          if ($actual -ne '3AD9389B328AC47BD2D069068A94ABDB816ADAE26A777C33B627554882FEA45F') { throw "SII_Decrypt checksum mismatch: $actual" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' launcher-src/installer.iss
      - name: Checksums
        shell: pwsh
        run: Get-FileHash artifacts/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VTC-Truck-Hub-Launcher
          path: artifacts/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          generate_release_notes: true
