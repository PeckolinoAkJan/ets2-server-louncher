# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Run JavaScript tests
        run: node --test tests/server.test.mjs tests/multiplayer-hub.test.mjs vtc-client/tests/*.test.mjs
      - name: Build launcher
        run: dotnet build launcher-src/VtcTruckHub.Launcher/VtcTruckHub.Launcher.csproj -c Release
      - name: Compile native SCS bridge
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://download.eurotrucksimulator2.com/scs_sdk_1_14.zip' -OutFile scs_sdk.zip
          Expand-Archive scs_sdk.zip -DestinationPath scs_sdk
          cmake -S vtc-client/native-plugin -B vtc-client/native-plugin/build -A x64 "-DSCS_SDK_INCLUDE=$pwd/scs_sdk/include"
          cmake --build vtc-client/native-plugin/build --config Release
